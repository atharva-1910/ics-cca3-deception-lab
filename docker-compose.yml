# Lab environment (HANDOVER §10.1, Module 1; CLAUDE.md §1-§2).
#
# decnet is internal: true (no internet, no LAN exposure) with static IPAM on
# 10.66.0.0/24. Real hosts .10-.19, decoys .20-.39, attacker .100, infra below .10.
#
# macOS note (CLAUDE.md §1 gotcha #2): a container on an internal-only network
# cannot reach the host's native Ollama, so ONLY the engine is additionally
# attached to the non-internal `egress` network. Decoys, real hosts and the
# attacker stay decnet-only. No service publishes a host port, so from the mac
# host/LAN nothing in the lab is reachable (§10.1 acceptance test).

services:
  real-ssh:
    build:
      context: .
      dockerfile: lab/real-ssh/Dockerfile
    hostname: app-01
    networks:
      decnet:
        ipv4_address: 10.66.0.10
    restart: unless-stopped

  real-web:
    build:
      context: .
      dockerfile: lab/real-web/Dockerfile
    hostname: web-front-01
    networks:
      decnet:
        ipv4_address: 10.66.0.11
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      # Decoy content model. 3B keeps per-command latency under ~5s (HANDOVER
      # §16); override with DECOY_MODEL. The agent uses its own model (below).
      - OLLAMA_MODEL=${DECOY_MODEL:-llama3.2:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./store:/opt/app/store
      - ./results:/opt/app/results
    networks:
      decnet:
        ipv4_address: 10.66.0.5
      egress: {}
    restart: unless-stopped

  attacker:
    build:
      context: .
      dockerfile: attacker/Dockerfile
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - AGENT_MODEL=${AGENT_MODEL:-llama3.1:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./results:/opt/attacker/results
      - ./attacker:/opt/attacker/attacker
    networks:
      decnet:
        ipv4_address: 10.66.0.100
      # egress carries ONLY the agent's own LLM calls to the host's Ollama. The
      # agent's TOOLS (nmap/ssh/http) remain hard-locked to 10.66.0.0/24 by the
      # allow-list in attacker/tools.py regardless of what this container can
      # route to, so egress does not widen the attack surface. Never publish a
      # host port here.
      egress: {}
    restart: "no"

networks:
  decnet:
    name: decnet
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.66.0.0/24
          gateway: 10.66.0.1
  egress:
    name: egress
    driver: bridge
